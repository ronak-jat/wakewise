<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WakeWise AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Official Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body data-theme="dark" class="login-body">
    <!-- Loader Mask -->
    <div id="loader-mask" class="loader-mask">
        <div class="spinner"></div>
        <p>INITIALIZING CLIENT PORTAL...</p>
    </div>

    <div class="login-glow-1"></div>
    <div class="login-glow-2"></div>

    <div class="login-wrapper">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>WakeWise <span class="grad-text">AI</span></span>
            </div>
            <p id="portal-desc">Access your cognitive workspace</p>
        </div>

        <!-- SEPARATE ROLE LOGIN TABS -->
        <div class="role-tabs-container">
            <button type="button" class="role-tab-btn active" data-role="user">
                <i class="fas fa-user-graduate"></i> User / Student
            </button>
            <button type="button" class="role-tab-btn" data-role="coach">
                <i class="fas fa-user-md"></i> Wellness Coach
            </button>
            <button type="button" class="role-tab-btn" data-role="admin">
                <i class="fas fa-shield-alt"></i> Administrator
            </button>
        </div>

        <!-- LOGIN FORM CONTAINER -->
        <div id="login-container" class="glass-card primary-hover">
            <h2 class="grad-text" id="login-title" style="text-align: center; margin-bottom: 20px; font-size: 1.5rem;">
                User / Student Sign In</h2>

            <form id="login-form" autocomplete="off">
                <!-- Hidden role input driven by role tabs -->
                <input type="hidden" id="login-role" value="user">

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="e.g., user@alarm.com"
                        autocomplete="off" value="" required>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••"
                        autocomplete="new-password" value="" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Access Portal <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>

            <!-- Google OAuth Section (Hidden for Administrators) -->
            <div id="google-oauth-wrapper">
                <div
                    style="margin: 16px 0; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <span style="height: 1px; flex: 1; background: rgba(255,255,255,0.1);"></span>
                    <span
                        style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Or
                        Continue With</span>
                    <span style="height: 1px; flex: 1; background: rgba(255,255,255,0.1);"></span>
                </div>

                <!-- Official Google Identity Services Render Container -->
                <div id="google-button-container"
                    style="width: 100%; display: flex; justify-content: center; margin-bottom: 8px; min-height: 44px;">
                </div>
                <div style="text-align: center; margin-bottom: 16px;">
                    <a id="google-redirect-link" href="#" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline; cursor: pointer;">
                        <i class="fab fa-google" style="margin-right: 4px;"></i> Alternate Google Sign-In (Redirect Flow)
                    </a>
                </div>
            </div>

            <div class="form-toggle-prompt" id="register-prompt-wrapper">
                Don't have an account? <a href="#" id="to-register-btn">Create one now</a>
            </div>
        </div>

        <!-- REGISTRATION FORM CONTAINER (HIDDEN BY DEFAULT) -->
        <div id="register-container" class="glass-card secondary-hover" style="display: none;">
            <h2 class="grad-text-secondary" style="text-align: center; margin-bottom: 20px; font-size: 1.5rem;">Register Account</h2>
            <form id="register-form" autocomplete="off">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g., Alex Mercer"
                        autocomplete="off" value="" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g., user@alarm.com"
                        autocomplete="off" value="" required>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters"
                        minlength="6" autocomplete="new-password" value="" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account <i
                        class="fas fa-user-plus"></i></button>
            </form>

            <!-- Google OAuth Section for Registration -->
            <div id="google-oauth-register-wrapper">
                <div
                    style="margin: 16px 0; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <span style="height: 1px; flex: 1; background: rgba(255,255,255,0.1);"></span>
                    <span
                        style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Or
                        Sign Up With</span>
                    <span style="height: 1px; flex: 1; background: rgba(255,255,255,0.1);"></span>
                </div>

                <!-- Official Google Identity Services Register Button Container -->
                <div id="google-register-button-container"
                    style="width: 100%; display: flex; justify-content: center; margin-bottom: 16px; min-height: 44px;">
                </div>
            </div>

            <div class="form-toggle-prompt">
                Already registered? <a href="#" id="to-login-btn">Sign in here</a>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-arrow-left"></i>
                Back to Landing Page</a>
        </div>
    </div>

    <!-- Script Sources -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js?v=1.0.2"></script>
    <script>
        // Google OAuth Configuration
        window.GOOGLE_CLIENT_ID = window.GOOGLE_CLIENT_ID || "1057786367809-mb9h4k6bjvcld420dpijgl6a038pcdjc.apps.googleusercontent.com";

        // 1. Official Google Identity Services (GSI) Callback
        window.handleGoogleCredentialResponse = async function (response) {
            if (!response || !response.credential) return;

            let googleEmail = '';
            let googleName = '';
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                const payload = JSON.parse(jsonPayload);
                googleEmail = payload.email;
                googleName = payload.name || payload.given_name;
            } catch (e) {
                console.warn('Google JWT parse warning:', e);
            }

            const roleInput = document.getElementById('login-role');
            const role = roleInput ? roleInput.value : 'user';

            Toast.show('Google Account Verified', 'Connecting to database...', 'info');

            const result = await loginWithGoogleAsync({
                token: response.credential,
                email: googleEmail,
                name: googleName,
                role: role
            });

            if (result.success) {
                Toast.show('Google Sign-In Successful', result.message, 'success');

                const loader = document.getElementById('loader-mask');
                if (loader) {
                    loader.classList.remove('hide');
                    loader.querySelector('p').textContent = 'AUTHENTICATING GOOGLE ACCOUNT...';
                }

                const targetRole = result.user ? result.user.role.toLowerCase() : 'user';
                setTimeout(() => {
                    if (targetRole === 'coach') {
                        window.location.href = getRelativePath('dashboard-coach.html');
                    } else if (targetRole === 'admin') {
                        window.location.href = getRelativePath('dashboard-admin.html');
                    } else {
                        window.location.href = getRelativePath('dashboard-user.html');
                    }
                }, 1000);
            } else {
                Toast.show('Google Sign-In Failed', result.message, 'danger');
            }
        };

        // 2. Initialize Google Identity Button & One-Tap Prompt
        window.addEventListener('load', () => {
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: window.GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    auto_select: false
                });

                const loginGoogleContainer = document.getElementById("google-button-container");
                if (loginGoogleContainer) {
                    google.accounts.id.renderButton(loginGoogleContainer, {
                        theme: "filled_blue",
                        size: "large",
                        width: "320",
                        type: "standard",
                        shape: "pill",
                        text: "continue_with"
                    });
                }

                const regGoogleContainer = document.getElementById("google-register-button-container");
                if (regGoogleContainer) {
                    google.accounts.id.renderButton(regGoogleContainer, {
                        theme: "filled_blue",
                        size: "large",
                        width: "320",
                        type: "standard",
                        shape: "pill",
                        text: "signup_with"
                    });
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            const loginContainer = document.getElementById('login-container');
            const registerContainer = document.getElementById('register-container');

            const toRegisterBtn = document.getElementById('to-register-btn');
            const toLoginBtn = document.getElementById('to-login-btn');

            const roleHiddenInput = document.getElementById('login-role');

            // Handle URL auth error notices
            const urlParams = new URLSearchParams(window.location.search);
            const authError = urlParams.get('error');
            if (authError) {
                let errorMsg = 'Google authentication could not be completed.';
                if (authError === 'admin_oauth_forbidden') errorMsg = 'Google Sign-In is disabled for Administrator accounts.';
                if (authError === 'google_auth_failed') errorMsg = 'Google sign-in was canceled or encountered an issue.';
                Toast.show('Authentication Notice', errorMsg, 'warning');
            }

            // Bind fallback Google OAuth redirect flow
            const redirectLink = document.getElementById('google-redirect-link');
            if (redirectLink) {
                redirectLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    const role = roleHiddenInput ? roleHiddenInput.value : 'user';
                    const apiBase = window.API_BASE_URL || '';
                    window.location.href = `${apiBase}/api/auth/google/login?role=${encodeURIComponent(role)}`;
                });
            }


            const roleTabs = document.querySelectorAll('.role-tab-btn');
            const loginTitle = document.getElementById('login-title');
            const registerPromptWrapper = document.getElementById('register-prompt-wrapper');
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');

            const regNameInput = document.getElementById('reg-name');
            const regEmailInput = document.getElementById('reg-email');
            const regPasswordInput = document.getElementById('reg-password');

            // Force forms reset on initialization
            loginForm.reset();
            registerForm.reset();
            emailInput.value = '';
            passwordInput.value = '';
            regNameInput.value = '';
            regEmailInput.value = '';
            regPasswordInput.value = '';

            // 1. Role Login Tabs Switching Handler
            function setActiveRoleTab(role) {
                roleTabs.forEach(tab => {
                    if (tab.dataset.role === role) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });

                roleHiddenInput.value = role;

                // Clear input fields so nothing is prefilled when changing tabs
                emailInput.value = '';
                passwordInput.value = '';

                // Adjust title and placeholder hints based on selected role
                const googleWrapper = document.getElementById('google-oauth-wrapper');

                if (role === 'user') {
                    loginTitle.textContent = 'User / Student Sign In';
                    emailInput.placeholder = 'e.g., user@alarm.com';
                    registerPromptWrapper.style.display = 'block';
                    if (googleWrapper) googleWrapper.style.display = 'block';
                } else if (role === 'coach') {
                    loginTitle.textContent = 'Wellness Coach Sign In';
                    emailInput.placeholder = 'e.g., coach@alarm.com';
                    registerPromptWrapper.style.display = 'none'; // Coaches cannot self-register; managed by Admin
                    if (googleWrapper) googleWrapper.style.display = 'block';
                    registerContainer.style.display = 'none';
                    loginContainer.style.display = 'block';
                } else if (role === 'admin') {
                    loginTitle.textContent = 'Administrator Portal Sign In';
                    emailInput.placeholder = 'e.g., admin@alarm.com';
                    registerPromptWrapper.style.display = 'none'; // Hide self-registration prompt for Admin
                    if (googleWrapper) googleWrapper.style.display = 'none'; // Hide Google OAuth for Admin
                    registerContainer.style.display = 'none';
                    loginContainer.style.display = 'block';
                }
            }

            roleTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const selectedRole = tab.dataset.role;
                    setActiveRoleTab(selectedRole);

                    // Ensure login view is visible when switching tabs
                    registerContainer.style.display = 'none';
                    loginContainer.style.display = 'block';
                    document.getElementById('portal-desc').textContent = 'Access your cognitive workspace';
                });
            });

            // 2. Toggle Forms Handler
            toRegisterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                registerForm.reset();
                regNameInput.value = '';
                regEmailInput.value = '';
                regPasswordInput.value = '';

                loginContainer.style.display = 'none';
                registerContainer.style.display = 'block';
                document.getElementById('portal-desc').textContent = 'Join the cognitive wellness network';
            });

            toLoginBtn.addEventListener('click', (e) => {
                e.preventDefault();
                loginForm.reset();
                emailInput.value = '';
                passwordInput.value = '';

                registerContainer.style.display = 'none';
                loginContainer.style.display = 'block';
                document.getElementById('portal-desc').textContent = 'Access your cognitive workspace';
            });

            // 3. Parse Query Params to Pre-select Role or Mode
            const preSelectedRole = urlParams.get('role');
            const mode = urlParams.get('mode');

            if (preSelectedRole && ['user', 'coach', 'admin'].includes(preSelectedRole)) {
                setActiveRoleTab(preSelectedRole);
            } else {
                setActiveRoleTab('user');
            }

            if (mode === 'register') {
                loginContainer.style.display = 'none';
                registerContainer.style.display = 'block';
                document.getElementById('portal-desc').textContent = 'Join the cognitive wellness network';
            }

            // 4. Form Submissions powered strictly by PostgreSQL & FastAPI Backend API
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const pass = passwordInput.value.trim();

                const result = await attemptLoginAsync(email, pass);

                if (result.success) {
                    Toast.show('Welcome Back', result.message, 'success');

                    const loader = document.getElementById('loader-mask');
                    if (loader) {
                        loader.classList.remove('hide');
                        loader.querySelector('p').textContent = 'ESTABLISHING DASHBOARD SESSION...';
                    }

                    const targetRole = result.user ? result.user.role.toLowerCase() : 'user';
                    setTimeout(() => {
                        if (targetRole === 'coach') {
                            window.location.href = getRelativePath('dashboard-coach.html');
                        } else if (targetRole === 'admin') {
                            window.location.href = getRelativePath('dashboard-admin.html');
                        } else {
                            window.location.href = getRelativePath('dashboard-user.html');
                        }
                    }, 1000);
                } else {
                    Toast.show('Access Denied', result.message, 'danger');
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = regNameInput.value.trim();
                const email = regEmailInput.value.trim();
                const pass = regPasswordInput.value.trim();
                const role = roleHiddenInput.value || 'USER';

                const result = await registerUserAsync(name, email, pass, role);

                if (result.success) {
                    Toast.show('Registered!', result.message, 'success');
                    registerForm.reset();
                    loginForm.reset();
                    emailInput.value = '';
                    passwordInput.value = '';

                    setTimeout(() => {
                        registerContainer.style.display = 'none';
                        loginContainer.style.display = 'block';
                        document.getElementById('portal-desc').textContent = 'Access your cognitive workspace';
                    }, 1000);
                } else {
                    Toast.show('Registration Failed', result.message, 'warning');
                }
            });
        });
    </script>
</body>

</html>
