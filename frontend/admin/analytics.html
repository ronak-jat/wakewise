<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Analytics - WakeWise Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-theme="dark">
    <div class="db-wrapper">
        <aside class="db-sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>WakeWise Admin</span>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-menu-item"><a href="dashboard-admin.html#dashboard"><i class="fas fa-sliders-h"></i>
                        <span>Dashboard</span></a></li>
                <li class="sidebar-menu-item"><a href="users.html"><i class="fas fa-users-cog"></i> <span>Users
                            Console</span></a></li>
                <li class="sidebar-menu-item"><a href="roles.html"><i class="fas fa-key"></i> <span>Role
                            Permissions</span></a></li>
                <li class="sidebar-menu-item"><a href="reports.html"><i class="fas fa-file-alt"></i> <span>Reports &
                            Exports</span></a></li>
                <li class="sidebar-menu-item active"><a href="analytics.html"><i class="fas fa-chart-bar"></i>
                        <span>System Analytics</span></a></li>
            </ul>
        </aside>

        <main class="db-main" style="padding: 24px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;" class="dashboard-grid">
                <div class="glass-card primary-hover">
                    <h3>Alarm Setup Distributions</h3>
                    <div class="chart-container" style="margin-top: 20px;">
                        <canvas id="adminAlarmStatsChart"></canvas>
                    </div>
                </div>
                <div class="glass-card secondary-hover">
                    <h3>Role Distributions</h3>
                    <div class="chart-container" style="margin-top: 20px;">
                        <canvas id="adminRoleDistChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Sources -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/config.js?v=1.0.9"></script>
    <script src="../js/utils.js?v=1.0.9"></script>
    <script src="../js/auth.js?v=1.0.9"></script>
    <script>protectPage('admin');</script>
    <script src="../js/admin.js?v=1.0.9"></script>
</body>

</html>
