<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations - WakeWise Coach</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">
    <div class="db-wrapper">
        <aside class="db-sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>WakeWise Coach</span>
                </div>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-menu-item"><a href="dashboard-coach.html#dashboard"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a></li>
                <li class="sidebar-menu-item"><a href="reports.html"><i class="fas fa-file-invoice"></i> <span>User Reports</span></a></li>
                <li class="sidebar-menu-item"><a href="trends.html"><i class="fas fa-moon"></i> <span>Sleep Trends</span></a></li>
                <li class="sidebar-menu-item"><a href="analytics.html"><i class="fas fa-heartbeat"></i> <span>Habit Analytics</span></a></li>
                <li class="sidebar-menu-item active"><a href="recommendations.html"><i class="fas fa-comment-medical"></i> <span>Recommendations</span></a></li>
                <li class="sidebar-menu-item"><a href="messages.html"><i class="fas fa-envelope"></i> <span>Messages Log</span></a></li>
            </ul>
        </aside>

        <main class="db-main" style="padding: 24px;">
            <div class="glass-card primary-hover" style="max-width: 600px; margin: 20px auto;">
                <h3 style="margin-bottom: 20px;">Issue Patient Wellness Advice</h3>
                <form id="recommendation-form-direct">
                    <div class="form-group" style="margin-bottom: 16px;">
                        <label for="rec-patient">Choose Patient</label>
                        <select id="rec-patient" class="form-control form-select" required>
                            <option value="" disabled selected>Select user...</option>
                            <option value="Alex Mercer">Alex Mercer</option>
                            <option value="Tony Stark">Tony Stark</option>
                            <option value="Steve Rogers">Steve Rogers</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="rec-text">Recommendation Notes</label>
                        <textarea id="rec-text" class="form-control" rows="5" placeholder="Type recommendation notes, workout advice, or sleep prep instructions..." required style="resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Dispatch Advice</button>
                </form>
            </div>
        </main>
    </div>

    <!-- Script Sources -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/utils.js?v=1.0.6"></script>
    <script src="../js/auth.js?v=1.0.6"></script>
    <script>protectPage('coach');</script>
    <script src="../js/coach.js"></script>
</body>
</html>
